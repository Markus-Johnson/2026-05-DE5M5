version: '3.8'

services:
  sql_server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourPassword123!
    ports:
      - "1433:1433"

  app:
    build: .
    depends_on:
      - sql_server
    environment:
      - SA_PASSWORD=YourPassword123!